[package]
name = "cripto-sniffer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }

yellowstone-grpc-client = "13.5.0"
yellowstone-grpc-proto = { version = "12.7.0", default-features = false }
futures = "0.3.34"
log = "0.4.34"
